# Explicit local-only profile. Never use this database or JWT key in production.
server:
  address: 127.0.0.1
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/toki_demo?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DEMO_DB_PASSWORD}
  jpa:
    show-sql: false
jwt:
  secret: local-synthetic-demo-only-not-for-production-0123456789
app:
  cors:
    allowed-origins: http://127.0.0.1:5175,http://localhost:5175
  upload:
    directory: ${java.io.tmpdir}/toki-local-demo-uploads
