spring:
  application:
    name: team1
  config:
    import: optional:application-local.yaml
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:51MB}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8080
  forward-headers-strategy: native
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    email-check:
      max-requests: ${EMAIL_CHECK_MAX_REQUESTS:20}
      window: ${EMAIL_CHECK_WINDOW:60s}
  upload:
    directory: ${UPLOAD_DIRECTORY:${java.io.tmpdir}/babylion-team1/uploads}
    max-expanded-size: ${UPLOAD_MAX_EXPANDED_SIZE:100MB}
  analysis:
    rework-keywords: ${ANALYSIS_REWORK_KEYWORDS:다시,아니,그게 아니라,수정해,틀렸,말고,again,not what}
    usd-krw-rate: ${USD_KRW_RATE:0}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    low-tier-model: gpt-4o-mini
    pricing:
      gpt-4o:
        input: 2.50
        output: 10.00
        tier: high
      gpt-4o-mini:
        input: 0.15
        output: 0.60
        tier: low
      gpt-4o-2024-08-06:
        input: 2.50
        output: 10.00
        tier: high
      gpt-4o-mini-2024-07-18:
        input: 0.15
        output: 0.60
        tier: low
