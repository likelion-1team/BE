services:
  mysql-demo:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_PASSWORD:?Set a local-only database password}
      MYSQL_DATABASE: toki_demo
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - toki-local-demo:/var/lib/mysql
    command: --innodb-buffer-pool-size=128M --max-connections=100
volumes:
  toki-local-demo:
