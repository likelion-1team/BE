name: BE checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: toki_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/toki_test?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: build/reports/tests/test/
          retention-days: 7
